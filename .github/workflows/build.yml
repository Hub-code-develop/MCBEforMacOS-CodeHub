name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  WINE_GDK_REPO: https://github.com/Weather-OS/WineGDK.git
  WINE_GDK_REF: b03ba49c4f326c36aa6930fbe6cf72841ef3738c
  XODUS_REPO: https://github.com/xodus-gaming/xodus.git
  XODUS_REF: main
  MOLTENVK_VERSION: 1.4.2
  DXVK_VERSION: 3.1.1
  VKD3D_PROTON_VERSION: 3.0.1

jobs:
  xodus-service:
    name: xodus-service (native macOS)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-xodus-${{ hashFiles('.github/workflows/build.yml') }}

      - name: 构建 xodus-service
        run: ./scripts/build-xodus-service.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: xodus-service
          path: artifacts/runtime/xodus
          if-no-files-found: error

  render-stack:
    name: render stack (MoltenVK/DXVK/vkd3d-proton)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: 收集渲染栈
        run: ./scripts/fetch-render-stack.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: render-stack
          path: artifacts/runtime/render
          if-no-files-found: error

  runtime:
    name: runtime (Wine x86_64 + 打包 nupkg)
    runs-on: macos-15-intel
    needs: [ xodus-service, render-stack ]
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Caches/Homebrew/downloads || true
          sudo rm -rf /usr/local/Homebrew/Library/Taps || true
          df -h /

      - name: 缓存 Wine 构建结果
        id: wine-cache
        uses: actions/cache@v4
        with:
          path: artifacts/runtime/wine
          key: wine-gdk-${{ env.WINE_GDK_REF }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: 构建 Wine(WineGDK,x86_64)
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-wine.sh

      - name: Wine 缓存命中,校验产物
        if: steps.wine-cache.outputs.cache-hit == 'true'
        run: |
          test -x artifacts/runtime/wine/bin/wine
          test -f artifacts/runtime/wine/lib/wine/x86_64-windows/xgameruntime.dll
          test -f artifacts/runtime/wine/lib/wine/x86_64-unix/xgameruntime.so
          artifacts/runtime/wine/bin/wine --version || true

      - name: 下载 xodus-service
        uses: actions/download-artifact@v4
        with:
          name: xodus-service
          path: artifacts/runtime/xodus

      - name: 下载渲染栈
        uses: actions/download-artifact@v4
        with:
          name: render-stack
          path: artifacts/runtime/render

      - name: 确保可执行位
        run: chmod +x artifacts/runtime/xodus/xodus-service

      - name: 汇总并自检
        env:
          WINE_GDK_REF: ${{ env.WINE_GDK_REF }}
          XODUS_REF: ${{ env.XODUS_REF }}
        run: ./scripts/assemble-runtime.sh

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 解析版本号
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本:${VERSION}"

      - name: 打包 NuGet
        run: |
          dotnet pack src/CodeHub.MCBEforMacOS/CodeHub.MCBEforMacOS.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o artifacts/packages

      - name: 打包结果
        run: ls -lh artifacts/packages

      - name: 上传 NuGet 包
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: publish (GitHub Packages)
    runs-on: ubuntu-latest
    needs: runtime
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 推送到 GitHub Packages
        run: |
          dotnet nuget push packages/*.nupkg \
            --source "https://nuget.pkg.github.com/Hub-code-develop/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate